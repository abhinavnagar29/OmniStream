name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: omnistream
          POSTGRES_PASSWORD: omnistream_dev_pw
          POSTGRES_DB: omnistream_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://omnistream:omnistream_dev_pw@localhost:5432/omnistream_test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: npm test

      # Fails the build if tests fail (npm test's non-zero exit code does this
      # automatically) -- no separate step needed, called out here for clarity.
